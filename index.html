  <style>

    /* Loader */

    /* Shared controls */

    .intro-grid {

    function Cursor() {

        const ring = document.querySelector(".cursor-ring");
        if (!dot || !ring || !gsap) return;
        const xDot = gsap.quickTo(dot, "x", { duration: .12, ease: "power3" });
        const yDot = gsap.quickTo(dot, "y", { duration: .12, ease: "power3" });
        const xRing = gsap.quickTo(ring, "x", { duration: .4, ease: "power3" });
        const yRing = gsap.quickTo(ring, "y", { duration: .4, ease: "power3" });
        const move = event => {
          xDot(event.clientX); yDot(event.clientY);
          xRing(event.clientX); yRing(event.clientY);
        };
        const over = event => {
          if (event.target.closest("a, button, .service-row, .grid-card")) document.body.classList.add("cursor-active");
          else document.body.classList.remove("cursor-active");
        };
        window.addEventListener("mousemove", move);
        document.addEventListener("mouseover", over);
        return () => {
          window.removeEventListener("mousemove", move);
          document.removeEventListener("mouseover", over);
        };
      }, []);
      return null;
    }

        window.__lenis = lenis;
        return () => {
          gsap?.ticker.remove(update);
          lenis.destroy();
          window.__lenis = null;
        };
      }, []);
      return null;
    }

    function ProjectGrid() {
      const [filter, setFilter] = useState("All");
      const gridRef = useRef(null);
      const muuriRef = useRef(null);
      const categories = ["All", "Residential", "Commercial", "Kitchen", "Bedroom"];

      useEffect(() => {
        if (!window.Muuri || !gridRef.current) return;
        const timer = setTimeout(() => {
          muuriRef.current = new window.Muuri(gridRef.current, {
            items: ".project-grid-item",
            layoutDuration: 700,
            layoutEasing: "cubic-bezier(.22,1,.36,1)",
            dragEnabled: false,
            visibleStyles: { opacity: "1", transform: "scale(1)" },
            hiddenStyles: { opacity: "0", transform: "scale(.94)" }
          });
          muuriRef.current.refreshItems().layout();
        }, 100);
        return () => {
          clearTimeout(timer);
          muuriRef.current?.destroy();
        };
      }, []);

      useEffect(() => {
        if (!window.Atropos) return;
        const instances = Array.from(document.querySelectorAll(".grid-card .atropos")).map(element =>
          window.Atropos({ el: element, shadow: false, highlight: true, rotateXMax: 3, rotateYMax: 3, duration: 500 })
        );
        return () => instances.forEach(instance => instance?.destroy());
      }, []);

      const applyFilter = next => {
        if (next === filter) return;
        const items = gridRef.current ? Array.from(gridRef.current.querySelectorAll(".project-grid-item")) : [];
        const state = window.Flip && items.length ? window.Flip.getState(items) : null;
        setFilter(next);
        muuriRef.current?.filter(item => next === "All" || item.getElement().dataset.category === next);
        if (state && window.Flip) window.Flip.from(state, { duration: .75, ease: "power3.inOut", absolute: true });
      };

      return (
        <section className="section">
          <div className="container">
            <div className="filters reveal">
              {categories.map(category => (
                <button key={category} className={"filter-button " + (filter === category ? "active" : "")} onClick={() => applyFilter(category)}>
                  {category}
                </button>
              ))}
            </div>
            <div className="projects-grid" ref={gridRef}>
              {PROJECTS.map((project, index) => (
                <div className={"project-grid-item " + project.layout} data-category={project.category} key={project.slug}>

                          <span className="grid-tag" data-atropos-offset="4">0{index + 1} · {project.category}</span>
                        </div>
                      </div></div></div>
                    </div>
                    <div className="grid-card-info">
                      <div><h3>{project.title}</h3><p>{project.type} · {project.location}</p></div>
                      <span className="round-arrow"><ArrowUpRight size={15} /></span>
                    </div>
                  </Link>
                </div>
              ))}
            </div>
          </div>
        </section>
      );
    }

                <Link className="button light" to="/contact">Start a project <ArrowUpRight size={14} /></Link>
              </div>
              <div className="footer-column">
                <h4>Navigate</h4>
                <Link to="/projects">Projects</Link>
                <Link to="/services">Services</Link>
                <Link to="/studio">Studio</Link>
                <Link to="/contact">Contact</Link>
              </div>
              <div className="footer-column">
                <h4>Connect</h4>
                <a href="tel:+919014624503">+91 90146 24503</a>
                <a href="mailto:ezyinterior@gmail.com">Email the studio</a>
                <a href="http://www.ezyinterior.com/" target="_blank" rel="noreferrer">ezyinterior.com</a>
                <span>Khammam, Telangana</span>
              </div>
            </div>
            <div className="footer-bottom">
              <span>© {new Date().getFullYear()} Ezy Interiors & Architects · Representative stock imagery used for this concept</span>
              <span>GSTIN · 36**********1ZT</span>
              <button className="back-top" onClick={() => window.__lenis ? window.__lenis.scrollTo(0) : window.scrollTo({ top: 0, behavior: "smooth" })}>Back to top <MoveUp size={12} /></button>
            </div>
          </div>
        </footer>
      );
    }

    function App() {
      const [loading, setLoading] = useState(true);
      const [noir, setNoir] = useState(false);
      const location = useLocation();
      useEffect(() => {
        document.body.classList.toggle("noir", noir);
      }, [noir]);
      return (
        <div className="app" data-eleventy-source="main">
          <AnimatePresence>{loading && <Loader onDone={() => setLoading(false)} />}</AnimatePresence>
          <ScrollProgress />
          <Cursor />
          <SmoothScroll />
          <MotionDirector />
          <Navigation noir={noir} setNoir={setNoir} />
          <AnimatePresence mode="wait" initial={false}>
            <Routes location={location} key={location.pathname}>
              <Route path="/" element={<Home />} />
              <Route path="/projects" element={<Projects />} />
              <Route path="/projects/:slug" element={<ProjectDetail />} />
              <Route path="/services" element={<Services />} />
              <Route path="/studio" element={<Studio />} />
              <Route path="/contact" element={<Contact />} />
              <Route path="*" element={<NotFound />} />
            </Routes>
          </AnimatePresence>
          <Footer />
          <Toaster
            position="bottom-right"
            richColors
            toastOptions={{
              style: { fontFamily: "DM Sans, sans-serif", borderRadius: "2px" }
            }}
          />
        </div>
      );
    }

    createRoot(document.getElementById("root")).render(
      <HashRouter>
        <App />
      </HashRouter>
    );
  </script>
</body>
</html>
