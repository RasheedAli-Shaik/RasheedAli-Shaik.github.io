        --color-janani-sky: #eaf7fc;
        --color-janani-peach: #fbe9df;
        --color-janani-cream: #fffaf6;
        --color-janani-ink: #263943;

      }
      html {
        scroll-behavior: auto;
      }

        margin: 0;
        overflow-x: hidden;

        color: var(--ink);
        font-family: "DM Sans", sans-serif;
      }
      h1,
      h2,
      h3,
      h4,
      .font-display {
        font-family: "Nunito", sans-serif;
        letter-spacing: -0.035em;
      }
      button,
      a,
      input,
      select,
      textarea {
        -webkit-tap-highlight-color: transparent;
      }
      button {
        cursor: pointer;
      }
      ::selection {
        background: #bce8f8;
        color: var(--deep);
      }

        position: fixed;
        inset: 0;
        pointer-events: none;
        z-index: 100;

      .soft-shadow {
        box-shadow: 0 24px 70px rgba(18, 61, 85, 0.13);
      }
      .card-shadow {
        box-shadow: 0 12px 35px rgba(18, 61, 85, 0.08);
      }
      .text-balance {
        text-wrap: balance;
      }
      .nav-link {
        position: relative;
      }
      .nav-link::after {
        content: "";
        position: absolute;
        left: 0;
        right: 100%;
        bottom: -8px;
        height: 3px;
        border-radius: 99px;
        background: var(--orange);
        transition: right 0.25s ease;
      }
      .nav-link:hover::after,
      .nav-link.active::after {
        right: 0;
      }
      .hero-grid {
        background-image: radial-gradient(
          rgba(0, 116, 186, 0.13) 1.25px,
          transparent 1.25px
        );
        background-size: 24px 24px;
      }
      .wave-card {
        border-radius: 42% 58% 51% 49% / 39% 42% 58% 61%;
      }
      .service-card {
        transition: transform 0.35s ease, box-shadow 0.35s ease,
          border-color 0.35s ease;
      }
      .service-card:hover {
        transform: translateY(-7px);
        box-shadow: 0 22px 55px rgba(18, 61, 85, 0.14);
        border-color: rgba(0, 116, 186, 0.26);
      }
      .gallery-image {
        transition: transform 0.75s cubic-bezier(0.2, 0.8, 0.2, 1);
      }
      .gallery-card:hover .gallery-image {
        transform: scale(1.055);
      }
      .float-one {
        animation: floatOne 7s ease-in-out infinite;
      }
      .float-two {
        animation: floatTwo 8.5s ease-in-out infinite;
      }
      .spin-soft {
        animation: spinSoft 18s linear infinite;
      }
      @keyframes floatOne {
        0%,
        100% {
          transform: translateY(0) rotate(-2deg);
        }
        50% {
          transform: translateY(-13px) rotate(2deg);
        }
      }
      @keyframes floatTwo {
        0%,
        100% {
          transform: translateY(0) rotate(2deg);
        }
        50% {
          transform: translateY(11px) rotate(-2deg);
        }
      }
      @keyframes spinSoft {
        to {
          transform: rotate(360deg);
        }
      }
      .marquee-track {
        min-width: max-content;
        animation: marquee 28s linear infinite;
      }
      @keyframes marquee {
        to {
          transform: translateX(-50%);
        }
      }
      .input-field {
        width: 100%;
        border: 1px solid #d9e4e8;
        background: #fff;
        border-radius: 15px;
        padding: 13px 15px;
        color: var(--ink);
        outline: none;
        transition: border-color 0.2s, box-shadow 0.2s;
      }
      .input-field:focus {
        border-color: var(--blue);
        box-shadow: 0 0 0 4px rgba(0, 116, 186, 0.11);
      }
      .input-field::placeholder {
        color: #93a7af;
      }
      .toast-in {
        animation: toastIn 0.35s cubic-bezier(0.2, 0.8, 0.2, 1);
      }
      @keyframes toastIn {
        from {
          opacity: 0;
          transform: translate(-50%, 18px) scale(0.96);
        }
        to {
          opacity: 1;
          transform: translate(-50%, 0) scale(1);
        }
      }
      .success-pop {
        animation: successPop 0.55s cubic-bezier(0.2, 1.5, 0.3, 1);
      }
      @keyframes successPop {
        from {
          opacity: 0;
          transform: scale(0.3) rotate(-10deg);
        }
        to {
          opacity: 1;
          transform: scale(1) rotate(0);
        }
      }
      .hero-play {
        --mx: 72%;
        --my: 44%;
        isolation: isolate;
      }
      .hero-spotlight {
        position: absolute;
        z-index: 1;
        left: var(--mx);
        top: var(--my);
        width: 440px;
        aspect-ratio: 1;
        transform: translate(-50%, -50%);
        border-radius: 50%;
        pointer-events: none;
        opacity: 0;
        background: radial-gradient(
          circle,
          rgba(0, 116, 186, 0.13),
          rgba(199, 102, 51, 0.07) 40%,
          transparent 70%

        transition: opacity 0.3s;
      }
      .hero-pattern {
        position: absolute;
        inset: 0;
        z-index: 1;
        pointer-events: none;
        opacity: 0;
        background-image: url("data:image/svg+xml,%3Csvg width='72' height='72' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M36 27v18M27 36h18' stroke='%230074ba' stroke-width='1.4' stroke-linecap='round' opacity='.6'/%3E%3Ccircle cx='6' cy='6' r='2' fill='%23c76633' opacity='.65'/%3E%3C/svg%3E");
        -webkit-mask-image: radial-gradient(
          circle 270px at var(--mx) var(--my),
          #000 0%,
          rgba(0, 0, 0, 0.75) 45%,
          transparent 100%
        );
        mask-image: radial-gradient(
          circle 270px at var(--mx) var(--my),
          #000 0%,
          rgba(0, 0, 0, 0.75) 45%,
          transparent 100%
        );
        transition: opacity 0.3s;
      }
      .hero-play:hover .hero-pattern {
        opacity: 0.65;
      }
      .hero-play:hover .hero-spotlight {
        opacity: 1;
      }
      .hide-scrollbar::-webkit-scrollbar {
        display: none;
      }
      .hide-scrollbar {
        scrollbar-width: none;
      }
      @media (hover: none), (pointer: coarse) {
        .hero-pattern,
        .hero-spotlight {
          display: none;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          animation-duration: 0.01ms !important;
          animation-iteration-count: 1 !important;
          transition-duration: 0.01ms !important;
          scroll-behavior: auto !important;
        }
      }
    </style>
  </head>

                      <label className="text-xs font-bold text-janani-ink/60">

                          placeholder="Email address"

                      </div>

                    <div className="grid gap-5 sm:grid-cols-2">

                          type="date"

                      <label className="text-xs font-bold text-janani-ink/60">

                        <select

                          <option value="">Select a time</option>

                          <option>Afternoon — 12 PM to 4 PM</option>
                          <option>Evening — 4 PM to 8 PM</option>
                        </select>
                      </label>
                    </div>
                    <div className="mt-5 grid gap-3 sm:grid-cols-2">
                      {[
                        [
                          "hospital",
                          "Hospital visit",
                          "Visit the N S T Road hospital.",
                        ],
                        [
                          "callback",
                          "Phone discussion first",
                          "Request an initial callback before visiting.",
                        ],
                      ].map(([v, t, b]) => (
                        <label
                          key={v}
                          className={`cursor-pointer rounded-2xl border p-5 transition ${
                            visit === v
                              ? "border-janani-blue bg-janani-sky"
                              : "border-janani-blue/10"

                        >
                          <div className="flex items-start gap-3">
                            <input
                              type="radio"
                              checked={visit === v}
                              onChange={() => setVisit(v)}
                              className="mt-1 accent-[#0074ba]"
                            />
                            <span>
                              <strong className="block text-sm text-janani-deep">
                                {t}
                              </strong>
                              <span className="mt-1 block text-xs leading-5 text-janani-ink/48">
                                {b}
                              </span>
                            </span>
                          </div>
                        </label>
                      ))}
                    </div>
                  </section>
                </div>
                <aside className="h-fit rounded-[27px] bg-janani-deep p-7 text-white lg:sticky lg:top-32">
                  <h2 className="text-2xl font-black">Care summary</h2>
                  <div className="mt-6 space-y-4">
                    {cart.map((x) => (
                      <div
                        key={x.id}
                        className="flex gap-3 border-b border-white/10 pb-4"
                      >
                        <span className="grid h-9 w-9 shrink-0 place-items-center rounded-xl bg-white/10">
                          {serviceSymbols[x.icon]}
                        </span>
                        <div className="min-w-0 flex-1">
                          <div className="text-xs font-bold leading-5">
                            {x.name}
                          </div>
                          <span className="text-[10px] text-white/42">
                            {x.qty} {x.qty === 1 ? "patient" : "patients"}

                      </div>
                    ))}
                  </div>
                  <div className="mt-6 rounded-xl bg-white/[.06] p-4 text-xs leading-5 text-white/55">
                    <strong className="text-white">₹0 due online.</strong>{" "}
                    Consultation or treatment fees, if applicable, are
                    communicated by the hospital.
                  </div>
                  <label className="mt-6 flex items-start gap-3 text-[11px] leading-5 text-white/55">
                    <input
                      required
                      type="checkbox"

                    />

                      I understand this is an appointment request and requires

                    </span>
                  </label>
                  <Button
                    type="submit"

                    className="mt-6 w-full"

                  <div className="mt-4 flex items-center justify-center gap-2 text-[10px] text-white/35">
                    <Icon name="lock" size={13} /> Details are stored locally

                  </div>
                </aside>
              </div>
            </form>
          </main>
        );
      }

      function Footer() {
        return (
          <footer className="bg-janani-deep px-5 pb-8 pt-16 text-white sm:px-8 lg:px-12">
            <div className="mx-auto max-w-[1400px]">
              <div className="grid gap-12 border-b border-white/10 pb-12 md:grid-cols-2 lg:grid-cols-[1.45fr_1fr_1fr_1.3fr]">
                <div>
                  <button
                    onClick={() => go("home")}
                    className="flex items-center gap-3 text-left"
                  >
                    <img
                      src={LOGO}
                      alt="Janani logo"
                      className="h-12 w-12 rounded-2xl object-cover"
                    />
                    <div>
                      <div className="font-display text-lg font-black">
                        Janani
                      </div>
                      <div className="text-[9px] font-bold uppercase tracking-[.18em] text-white/45">

                      </div>
                    </div>
                  </button>
                  <p className="mt-5 max-w-sm text-sm leading-6 text-white/45">
                    Round-the-clock pediatric, neonatal and women's care for

                  </p>
                  <div className="mt-5 inline-flex items-center gap-2 rounded-full bg-white/[.07] px-4 py-2 text-xs font-bold">

                </div>
                <div>
                  <h3 className="text-sm font-black">Explore</h3>
                  <div className="mt-5 flex flex-col items-start gap-3">

                      ["care", "Care services"],

                  </div>
                </div>
                <div>
                  <h3 className="text-sm font-black">Patient care</h3>
                  <div className="mt-5 flex flex-col items-start gap-3">
                    <button
                      onClick={() => go("contact")}
                      className="text-xs text-white/45 hover:text-[#ffb68e]"
                    >
                      Request appointment
                    </button>
                    <button
                      onClick={() => go("care")}
                      className="text-xs text-white/45 hover:text-[#ffb68e]"
                    >
                      Pediatric care
                    </button>
                    <button
                      onClick={() => go("care")}
                      className="text-xs text-white/45 hover:text-[#ffb68e]"
                    >
                      Women's care
                    </button>
                    <button
                      onClick={() => go("cart")}
                      className="text-xs text-white/45 hover:text-[#ffb68e]"

                      Care cart
                    </button>
                  </div>
                </div>
                <div>
                  <h3 className="text-sm font-black">Find us</h3>
                  <p className="mt-5 text-xs leading-5 text-white/45">
                    {address}
                  </p>
                  <a
                    href={mapUrl}
                    target="_blank"
                    rel="noreferrer"

                  >
                    <Icon name="pin" size={15} />

                  </a>
                </div>
              </div>
              <div className="flex flex-col gap-3 pt-7 text-[10px] text-white/30 sm:flex-row sm:justify-between">
                <span>
                  © {new Date().getFullYear()} Janani Children Hospital.

                <span>
                  Website information is general and does not replace

                </span>
              </div>
            </div>
          </footer>
        );
      }

      function App() {
        const route = useRoute();
        const [cart, setCart] = useState(() => {
          try {
            return JSON.parse(localStorage.getItem("jananiCareCart")) || [];
          } catch {
            return [];
          }
        });
        const [toast, setToast] = useState("");
        useEffect(() => {
          try {
            localStorage.setItem("jananiCareCart", JSON.stringify(cart));
          } catch {}
        }, [cart]);
        useEffect(() => {
          scrollTo(0, 0);
          const ctx = gsap.context(() => {
            gsap.fromTo(
              ".page-enter",
              { opacity: 0, y: 25 },
              {
                opacity: 1,
                y: 0,
                duration: 0.7,
                stagger: 0.06,
                ease: "power3.out",
              }
            );
            gsap.fromTo(
              ".hero-copy > *",
              { opacity: 0, y: 26 },
              {
                opacity: 1,
                y: 0,
                duration: 0.8,
                stagger: 0.1,
                ease: "power3.out",
              }
            );
            gsap.fromTo(
              ".hero-visual",
              { opacity: 0, x: 30, scale: 0.95 },
              { opacity: 1, x: 0, scale: 1, duration: 1.05, ease: "power3.out" }
            );
            document
              .querySelectorAll(".section-reveal")
              .forEach((el) =>
                gsap.fromTo(
                  el,
                  { opacity: 0, y: 34 },
                  {
                    opacity: 1,
                    y: 0,
                    duration: 0.8,
                    ease: "power3.out",
                    scrollTrigger: {
                      trigger: el,
                      start: "top 88%",
                      once: true,
                    },
                  }
                )
              );
            requestAnimationFrame(() => ScrollTrigger.refresh());
          });
          return () => ctx.revert();
        }, [route]);
        useEffect(() => {
          if (!window.Lenis) return;
          const lenis = new Lenis({
            duration: 1.05,
            smoothWheel: true,
            wheelMultiplier: 0.9,
          });
          lenis.on("scroll", ScrollTrigger.update);
          let raf;
          const tick = (t) => {
            lenis.raf(t);
            raf = requestAnimationFrame(tick);
          };
          raf = requestAnimationFrame(tick);
          return () => {
            cancelAnimationFrame(raf);
            lenis.destroy();
          };
        }, []);
        const add = (item) => {
          setCart((c) => {
            const found = c.find((x) => x.id === item.id);
            return found
              ? c.map((x) => (x.id === item.id ? { ...x, qty: x.qty + 1 } : x))
              : [...c, { ...item, qty: 1 }];
          });
          setToast(`${item.name} added to care cart`);
          setTimeout(() => setToast(""), 2500);
        };
        const change = (id, d) =>
          setCart((c) =>
            c.map((x) =>
              x.id === id ? { ...x, qty: Math.max(1, x.qty + d) } : x
            )
          );
        const remove = (id) => setCart((c) => c.filter((x) => x.id !== id));
        const count = cart.reduce((s, x) => s + x.qty, 0);
        const pages = {
          home: <HomePage add={add} />,
          care: <CarePage add={add} />,
          facilities: <FacilitiesPage />,
          about: <AboutPage />,
          contact: <ContactPage />,
          cart: <CartPage cart={cart} change={change} remove={remove} />,
          checkout: <CheckoutPage cart={cart} complete={() => setCart([])} />,
        };
        return (
          <>
            <Header route={route} count={count} />
            {pages[route] || pages.home}
            <Footer />
            {toast && (
              <div
                role="status"
                className="toast-in fixed bottom-6 left-1/2 z-[80] flex -translate-x-1/2 items-center gap-3 whitespace-nowrap rounded-full bg-janani-deep px-5 py-3 text-sm font-bold text-white shadow-2xl"
              >
                <span className="grid h-6 w-6 place-items-center rounded-full bg-janani-orange">
                  <Icon name="check" size={14} />
                </span>
                {toast}
                <button
                  onClick={() => go("cart")}
                  className="ml-2 text-xs text-[#ffb68e] underline underline-offset-4"
                >
                  View cart
                </button>
              </div>
            )}
          </>
        );
      }

      ReactDOM.createRoot(document.getElementById("root")).render(<App />);
    </script>
  </body>
</html>
